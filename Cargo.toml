[workspace]
resolver = "2"
members = [
    "crates/retrovert-player",
    "crates/retrovert-plugin-catalog",
    "crates/retrovert-player-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# retrovert-host is pinned by revision so this workspace resolves from a plain
# clone (and as a cargo git dependency) with no sibling checkouts. For local
# cross-repository development, redirect it back to a sibling path with a
# [patch] block in the consuming workspace, e.g.:
#
#   [patch."https://github.com/RetrovertApp/retrovert_api.git"]
#   retrovert-host = { path = "../retrovert/retrovert_api/rust/retrovert-host" }
log = "0.4"
retrovert-host = { git = "https://github.com/RetrovertApp/retrovert_api.git", rev = "d2e53fba46372d0af5278d6b4ec28f40d01a75ea" }
retrovert-player = { path = "crates/retrovert-player" }
retrovert-updater = { git = "https://github.com/RetrovertApp/retrovert-updater.git", rev = "95a0f514a237a1c4f4b69e1e6386ef337b8a16ad" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = true
